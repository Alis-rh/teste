hero:
  titulo: 'Toda empresa que cresce rápido enfrenta o mesmo dilema: liderar o voo da organização ou apagar os incêndios que o próprio crescimento provoca.'
  texto: |-
    
    A Alis RH existe para que a liderança fique com o voo. Unimos psicologia organizacional a rigor técnico e devolvemos à liderança o que o crescimento costuma consumir primeiro: a capacidade de planejar. Cada processo que assumimos recebe o mesmo nível de profundidade, do diagnóstico à decisão final.
  botao_principal:
    texto: Solicitar avaliação estratégica
    link: '#diagnostico'
  botao_secundario:
    texto: Conheça a Alis RH
    link: '#origem'

origem:
  titulo: De onde vem o nome Alis
  conteudo: |-
    Alis vem do latim e remete a asas: elevação, cuidado e crescimento contínuo. O símbolo não é decorativo. Ele descreve o método.

    Aves migratórias voam em formação porque cada integrante reduz o esforço de quem vem atrás, permitindo que o conjunto alcance distâncias que nenhuma delas alcançaria isoladamente. É essa lógica que aplicamos à gestão de pessoas: quando o esforço é bem distribuído, a liderança deixa de carregar sozinha o peso do crescimento e passa a guiar a rota.

proposito:
  titulo: Por que a Alis RH existe
  missao:
    titulo: Missão
    texto: Tirar a gestão de pessoas da informalidade e devolver ao RH o lugar de decisão estratégica dentro do negócio.
  visao:
    titulo: Visão
    texto: Ser a consultoria de referência nacional para lideranças que tratam a gestão de pessoas como decisão estratégica, com o mesmo rigor aplicado a qualquer outra área do negócio.

cultura:
  titulo: Os 5 Ps da Alis
  subtitulo: Nossa cultura
  texto: Nossos valores, em uma palavra cada
  pilares:
    - titulo: Precisão
      descricao: Decisão validada por dado e método, nunca por achismo.
    - titulo: Parceria
      descricao: Comunicação direta com quem lidera, sem meias-verdades.
    - titulo: Profundidade
      descricao: Poucos clientes por vez, para garantir atenção real.
    - titulo: Pragmatismo
      descricao: Soluções aplicáveis à rotina real da operação.
    - titulo: Previsibilidade
      descricao: Crescimento estável, sem picos e sem rotatividade.

metodologia:
  titulo: Como a Alis trabalha
  etapas:
    - numero: '01'
      titulo: Diagnóstico Antes da Decisão
      descricao: Antes de propor qualquer solução, entendemos o cenário, os dados e o contexto do negócio.
    - numero: '02'
      titulo: Execução Sem Sobrecarga
      descricao: Estruturamos processos que funcionam na rotina da empresa, sem criar burocracia desnecessária.
    - numero: '03'
      titulo: Decisão Orientada a Dados
      descricao: Transformamos informações de pessoas em indicadores que apoiam decisões mais seguras.
    - numero: '04'
      titulo: Estratégia Conectada ao Negócio
      descricao: Cada iniciativa de RH precisa estar conectada aos objetivos e desafios reais da organização.
    - numero: '05'
      titulo: Acompanhamento de Resultado
      descricao: Monitoramos a evolução das ações para identificar ajustes e sustentar os resultados.
    - numero: '06'
      titulo: Gestão que Permanece
      descricao: O objetivo não é criar dependência da consultoria, mas deixar processos estruturados e capazes de continuar funcionando.

